<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>AL Ops · Print</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <script
      src="https://unpkg.com/react@18.3.1/umd/react.development.js"
      integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"
      integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"
      integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y"
      crossorigin="anonymous"
    ></script>

    <style>
      :root {
        --crimson-50: #eef0fa; --crimson-100: #dbe0f4; --crimson-200: #b6c0e8;
        --crimson-300: #8593d2; --crimson-400: #4f63b8; --crimson-500: #2a3da0;
        --crimson-600: #1a2a8a; --crimson-700: #000080; --crimson-800: #000066;
        --crimson-900: #00004d;
        --ink-950: #0c0d10; --ink-900: #16181d; --ink-800: #22262e;
        --ink-700: #353a44; --ink-600: #525866; --ink-500: #717787;
        --ink-400: #9aa0ad; --ink-300: #c4c8d0; --ink-200: #e3e5ea;
        --ink-100: #eef0f3; --ink-50: #f6f7f9;
        --surface: #ffffff; --surface-muted: #f6f7f9; --surface-tinted: #fafbfc;
        --emerald-500: #10b981; --emerald-600: #059669; --emerald-50: #ecfdf5;
        --amber-500: #f59e0b; --amber-50: #fffbeb;
        --violet-500: #7c3aed; --violet-50: #f5f3ff;
        --sky-500: #0ea5e9; --sky-50: #f0f9ff;
        --font-sans: "Open Sans", ui-sans-serif, system-ui, sans-serif;
        --font-mono: "JetBrains Mono", ui-monospace, monospace;
        --r-sm: 6px; --r-md: 10px; --r-lg: 14px; --r-xl: 20px;
      }

      * { box-sizing: border-box; }
      html, body {
        margin: 0; padding: 0; background: #fff;
        color: var(--ink-900); font-family: var(--font-sans);
        -webkit-font-smoothing: antialiased;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }
      button { font: inherit; color: inherit; background: none; border: 0; }
      .pill {
        display: inline-flex; align-items: center; gap: 6px;
        padding: 4px 10px; border-radius: 999px;
        font-size: 11.5px; font-weight: 600;
      }
      .mono { font-family: var(--font-mono); }
      .serif { font-family: var(--font-sans); font-weight: 700; letter-spacing: -0.015em; }
      .pulse-dot { /* hold still in print */ }

      .print-page {
        background: #fff;
        padding: 24px;
        page-break-after: always;
        break-after: page;
        break-inside: avoid;
      }
      .print-page:last-child { page-break-after: auto; break-after: auto; }
      .print-page-title {
        font-size: 11px;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        font-weight: 700;
        color: var(--crimson-700);
        margin: 0 0 12px;
        padding-bottom: 8px;
        border-bottom: 1px solid var(--ink-200);
        display: flex;
        justify-content: space-between;
        align-items: baseline;
      }
      .print-page-title small {
        color: var(--ink-500); font-weight: 500;
        letter-spacing: 0.04em; text-transform: none;
      }

      /* Hide interactive chrome */
      [data-print-hide] { display: none !important; }

      @page {
        size: A3 landscape;
        margin: 8mm;
      }

      @media print {
        html, body { background: #fff !important; }
        button { cursor: default; }
        * { animation: none !important; transition: none !important; }
        .pulse-dot { opacity: 1 !important; }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script>
      window.__TWEAKS__ = {
        "brand": "crimson",
        "density": "comfortable",
        "marketplaceLayout": "grid",
        "showTags": true,
        "showPerf": true,
        "cardStyle": "solid",
        "showGovernance": true,
        "animateFlow": false
      };
      window.__PRINT__ = true;
    </script>

    <script type="text/babel" src="tweaks-panel.jsx"></script>
    <script type="text/babel" src="data.jsx"></script>
    <script type="text/babel" src="data-connectors.jsx"></script>
    <script type="text/babel" src="ui.jsx"></script>
    <script type="text/babel" src="views/gate-config.jsx"></script>
    <script type="text/babel" src="views/pipeline.jsx"></script>
    <script type="text/babel" src="views/marketplace.jsx"></script>
    <script type="text/babel" src="views/detail.jsx"></script>
    <script type="text/babel" src="views/composer.jsx"></script>
    <script type="text/babel" src="views/run.jsx"></script>
    <script type="text/babel" src="views/plan-groom.jsx"></script>

    <script type="text/babel">
      function PrintApp() {
        const project = window.PROJECTS[0];
        const t = window.__TWEAKS__;
        const noop = () => {};
        const pushNoop = () => {};

        const pipeline = React.useMemo(() => {
          const next = {};
          window.GATES.forEach((g) => {
            next[g.id] = window.AGENTS
              .filter((a) => a.gate === g.id && a.subscribed)
              .map((a) => a.id);
          });
          return next;
        }, []);

        return (
          <div>
            <section className="print-page">
              <div className="print-page-title">
                <span>1 · Pipeline overview</span>
                <small>AL Ops · AI-SDLC Marketplace</small>
              </div>
              <PipelineView
                project={project}
                tweaks={t}
                onOpenGate={noop}
                onJumpComposer={noop}
                pipeline={pipeline}
                setPipeline={noop}
                push={pushNoop}
              />
            </section>

            <section className="print-page">
              <div className="print-page-title">
                <span>2 · Plan & Groom — Gate 1 workflow</span>
                <small>Multi-agent planning</small>
              </div>
              <PlanGroomView
                project={project}
                onBack={noop}
                onOpenComposer={noop}
              />
            </section>

            <section className="print-page">
              <div className="print-page-title">
                <span>3 · Pipeline composer</span>
                <small>Tool selection · context · gate composition</small>
              </div>
              <ComposerView
                pipeline={pipeline}
                setPipeline={noop}
                openDetail={noop}
                push={pushNoop}
              />
            </section>

            <section className="print-page">
              <div className="print-page-title">
                <span>4 · Live run</span>
                <small>Commit progressing through the seven gates</small>
              </div>
              <RunView project={project} pipeline={pipeline} openDetail={noop} />
            </section>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<PrintApp />);

      // Auto-print after fonts + Babel + a settle delay
      (async function autoPrint() {
        try {
          if (document.fonts && document.fonts.ready) {
            await document.fonts.ready;
          }
        } catch (e) {}
        await new Promise((r) => setTimeout(r, 1200));
        if (!window.__noAutoPrint) window.print();
      })();
    </script>
  </body>
</html>
